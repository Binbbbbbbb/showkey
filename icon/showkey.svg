<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>ShowKey icon</title>
  <desc>Compact colorful Q W A S keyboard icon with W pressed.</desc>

  <!-- Background -->
  <rect width="1024" height="1024" rx="120" fill="#111722"/>

  <!-- Q -->
  <rect x="105" y="105" width="395" height="395" rx="72"
        fill="none" stroke="#42A5F5" stroke-width="30"/>
  <text x="302.5" y="365" text-anchor="middle"
        font-family="DejaVu Sans, sans-serif" font-size="190" font-weight="700"
        fill="#42A5F5">Q</text>

  <!-- W pressed: dark lower layer + bright face -->
  <rect x="524" y="130" width="395" height="395" rx="72" fill="#F57C00"/>
  <rect x="524" y="105" width="395" height="395" rx="72" fill="#FFB719"/>
  <text x="721.5" y="365" text-anchor="middle"
        font-family="DejaVu Sans, sans-serif" font-size="190" font-weight="700"
        fill="#FFFFFF">W</text>

  <!-- A -->
  <rect x="105" y="524" width="395" height="395" rx="72"
        fill="none" stroke="#42D99A" stroke-width="30"/>
  <text x="302.5" y="784" text-anchor="middle"
        font-family="DejaVu Sans, sans-serif" font-size="190" font-weight="700"
        fill="#42D99A">A</text>

  <!-- S -->
  <rect x="524" y="524" width="395" height="395" rx="72"
        fill="none" stroke="#9B6CF2" stroke-width="30"/>
  <text x="721.5" y="784" text-anchor="middle"
        font-family="DejaVu Sans, sans-serif" font-size="190" font-weight="700"
        fill="#9B6CF2">S</text>
</svg>
