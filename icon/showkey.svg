<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>QWAS Keyboard Logo</title>
  <desc>Minimal transparent QWAS keyboard logo. Q, A and S are blue outlined keys; W is a solid yellow key.</desc>

  <!-- Q -->
  <rect x="48" y="48" width="196" height="196" rx="40"
        fill="none" stroke="#0878F9" stroke-width="18"/>
  <text x="146" y="181" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700"
        fill="#0878F9">Q</text>

  <!-- W -->
  <rect x="268" y="48" width="196" height="196" rx="40"
        fill="#FFB800"/>
  <text x="366" y="181" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700"
        fill="#FFFFFF">W</text>

  <!-- A -->
  <rect x="48" y="268" width="196" height="196" rx="40"
        fill="none" stroke="#0878F9" stroke-width="18"/>
  <text x="146" y="401" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700"
        fill="#0878F9">A</text>

  <!-- S -->
  <rect x="268" y="268" width="196" height="196" rx="40"
        fill="none" stroke="#0878F9" stroke-width="18"/>
  <text x="366" y="401" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="700"
        fill="#0878F9">S</text>
</svg>
